[ACL4SSR]
name=ACL4SSR
url=https://github.com/ACL4SSR/ACL4SSR
branch=master
match=Clash/*.list|Clash/Ruleset/**

# Disabled on purpose: this section flat-copied ACL4SSR's upstream Clash/config/**
# over base/config/ on every build, silently reverting the region-group fixes
# (flag-emoji + case-insensitive filters) that we maintain in that directory.
# base/config/ACL4SSR_*.ini is now the source of truth.
# To pull upstream changes, run the sync by hand and re-apply the patches:
#   python3 scripts/update_rules.py -c scripts/rules_config.conf.acl4ssr
#   (or temporarily re-enable this section, then re-apply the region filters)
#[ACL4SSR_config]
#name=ACL4SSR
#url=https://github.com/ACL4SSR/ACL4SSR
#branch=master
#match=Clash/config/**
#dest=base/config/
#keep_tree=false

